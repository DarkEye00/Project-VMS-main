{% extends "pre.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow text-center">
  <h2 class="text-lg font-semibold mb-4 text-green-700">Check your email</h2>
  <p>
    If an account exists with the email you entered, you will receive a password reset link shortly.
    <br><br>
    Please check your inbox and follow the instructions.
  </p>
  <a href="{% url 'userauth:login' %}" class="mt-4 inline-block text-blue-600 underline">Back to Login</a>
</div>
{% endblock %}
