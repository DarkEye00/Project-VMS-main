{% extends "pre.html" %}
{% block content %}

  <h2 class="text-lg font-semibold mb-4 text-green-700">Password reset complete</h2>
  <p>
    Your password has been set. You may now log in with your new password.

  <a href="{% url 'userauth:login' %}" class="mt-4 inline-block text-blue-600 underline">Go to Login</a>
</div>
{% endblock %}
