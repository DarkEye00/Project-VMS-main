{% extends "pre.html" %}
{% block content %}
<section class="flex flex-col items-center w-full h-[100vh] text-gray-700 p-5 bg-gray-100">
  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow-md w-full">
    <h2 class="text-center text-green-600 font-semibold text-xl p-2">Reset your password</h2>
    <div class="p-5 flex justify-center">
      <form method="post" class="flex flex-col space-y-4 w-full">
        {% csrf_token %}
        <label for="id_email" class="font-medium text-sm text-gray-700">Email address</label>
        <input type="email" name="email" id="id_email" required
          class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
          placeholder="Enter your email address">
        <button type="submit" class="mt-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition duration-200">
          Send Reset Link
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
